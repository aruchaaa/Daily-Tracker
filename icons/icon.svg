<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="100" y1="50" x2="412" y2="494" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4d9a3"/>
      <stop offset="100%" stop-color="#c9922a"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Body -->
  <circle cx="256" cy="272" r="224" fill="#161227"/>
  <circle cx="256" cy="272" r="224" fill="none" stroke="url(#g)" stroke-width="14"/>
  <circle cx="256" cy="272" r="205" fill="none" stroke="#3b3158" stroke-width="1.5" opacity="0.5"/>

  <!-- Crown -->
  <rect x="244" y="22" width="24" height="36" rx="6" fill="#e8b355"/>
  <circle cx="256" cy="18" r="14" fill="#f4d9a3" stroke="#e8b355" stroke-width="2"/>

  <!-- Side button -->
  <rect x="452" y="212" width="30" height="14" rx="4" fill="#e8b355" transform="rotate(30 467 219)"/>

  <!-- Ticks — 12/3/6/9 gold, others dim -->
  <line x1="256" y1="97" x2="256" y2="116" stroke="#e8b355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="343" y1="121" x2="335" y2="134" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="408" y1="185" x2="395" y2="193" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="431" y1="272" x2="412" y2="272" stroke="#e8b355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="408" y1="359" x2="395" y2="351" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="343" y1="423" x2="335" y2="410" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="256" y1="447" x2="256" y2="428" stroke="#e8b355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="169" y1="423" x2="177" y2="410" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="359" x2="117" y2="351" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="81" y1="272" x2="100" y2="272" stroke="#e8b355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="104" y1="185" x2="117" y2="193" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>
  <line x1="169" y1="121" x2="177" y2="134" stroke="#6b5636" stroke-width="2" stroke-linecap="round"/>

  <!-- Hour hand (~10 o'clock) -->
  <line x1="256" y1="272" x2="174" y2="210" stroke="#f4d9a3" stroke-width="7" stroke-linecap="round" filter="url(#gl)"/>

  <!-- Minute hand (12) -->
  <line x1="256" y1="272" x2="256" y2="120" stroke="#e8b355" stroke-width="4.5" stroke-linecap="round" filter="url(#gl)"/>

  <!-- Center -->
  <circle cx="256" cy="272" r="10" fill="#e8b355"/>
  <circle cx="256" cy="272" r="4.5" fill="#161227"/>
</svg>
